<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a0f">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Nuhitster</title>
<style>
  :root{
    --bg:#0b0a0f; --panel:#15131c; --panel2:#1d1a27; --line:#2b2738;
    --txt:#ece8f4; --mute:#8d86a0; --metal:#ff3b30; --goth:#a66bff; --ok:#3ddc97;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{min-height:100vh;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}
  main{max-width:520px;margin:0 auto;padding-top:20px}
  a{color:var(--mute)}
  h1{margin:0;font-size:2.1rem;letter-spacing:.18em;font-weight:900;text-transform:uppercase;
     background:linear-gradient(90deg,var(--metal),var(--goth));-webkit-background-clip:text;background-clip:text;color:transparent}
  .tag{color:var(--mute);margin:4px 0 22px;font-size:.95rem}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
  .panel h2{margin:0 0 10px;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700}
  .row{display:flex;flex-wrap:wrap;gap:8px}
  button{font:inherit;color:inherit;cursor:pointer}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:.92rem}
  .chip[aria-pressed="true"]{border-color:var(--goth);background:#2a2142}
  .chip.metal[aria-pressed="true"]{border-color:var(--metal);background:#3a1714}
  .big{width:100%;border:0;border-radius:16px;padding:18px;font-size:1.15rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
       background:linear-gradient(90deg,var(--metal),var(--goth));color:#fff}
  .big:disabled{opacity:.4}
  .ghost{background:transparent;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .small{font-size:.85rem;color:var(--mute)}
  .warn{color:#ffb74d}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .stage{position:relative;aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
  .stage #yt{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .stage iframe{width:100%;height:100%;border:0}
  .cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#2a2142,#0b0a0f 70%)}
  .cover.off{display:none}
  .eq{display:flex;gap:6px;align-items:flex-end;height:46px}
  .eq i{width:8px;height:12px;background:linear-gradient(var(--goth),var(--metal));border-radius:3px}
  .playing .eq i{animation:eq .9s ease-in-out infinite}
  .playing .eq i:nth-child(2){animation-delay:.15s}.playing .eq i:nth-child(3){animation-delay:.3s}
  .playing .eq i:nth-child(4){animation-delay:.45s}.playing .eq i:nth-child(5){animation-delay:.6s}
  @keyframes eq{0%,100%{height:10px}50%{height:46px}}
  .ctrl{display:grid;grid-template-columns:1fr 2fr 1fr;gap:8px;margin:12px 0}
  .ctrl button{padding:14px 0;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-size:1.05rem}
  .ctrl .play{background:linear-gradient(90deg,var(--metal),var(--goth));border:0;font-weight:800}
  .reveal{text-align:center}
  .reveal .yr{font-size:4.2rem;font-weight:900;line-height:1;margin:6px 0}
  .reveal .tt{font-size:1.25rem;font-weight:700}
  .reveal .ar{color:var(--mute);margin-top:2px}
  .badge{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:999px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line)}
  .badge.metal{color:var(--metal);border-color:var(--metal)} .badge.gotico{color:var(--goth);border-color:var(--goth)}
  .msg{padding:12px;border-radius:12px;background:#2a1a1a;border:1px solid #5a2a2a;margin:12px 0;font-size:.92rem}
  table{width:100%;border-collapse:collapse;font-size:.85rem}
  th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--mute);font-weight:600}
  td.no{color:#ff7a70} td.ok{color:var(--ok)}
  .big.alt{background:var(--panel2);border:1px solid var(--line);margin-top:10px}
  .scan{position:relative;aspect-ratio:1/1;background:#000;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
  .scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .scan .frame{position:absolute;inset:16%;border:3px solid rgba(255,255,255,.85);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.45)}
  .scan .frame::after{content:"";position:absolute;left:6%;right:6%;top:12%;height:2px;background:linear-gradient(90deg,transparent,var(--metal),transparent);animation:sweep 1.6s ease-in-out infinite}
  @keyframes sweep{0%,100%{top:12%}50%{top:88%}}
  input.id{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--txt);font:inherit}
  .hide{display:none}
</style>
</head>
<body>
<main id="app"></main>
<script src="config.js"></script>

<script>
"use strict";

/* ---------- Configuración ---------- */
const BLOQUES = {
  todo:   "Todo mezclado",
  metal:  "Nu metal y metal moderno",
  gotico: "Gótico, post-punk y synthpop"
};
const TEMAS = {
  "nu-metal":"Nu metal", "alt-metal":"Alt metal", "metalcore":"Metalcore",
  "metal-moderno":"Metal moderno", "industrial":"Industrial",
  "gothic-rock":"Gothic rock", "post-punk":"Post-punk", "darkwave":"Darkwave",
  "synthpop":"Synthpop", "gothic-metal":"Gothic metal"
};

/* ---------- Utilidades ---------- */
const app = document.getElementById("app");
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs || {})){
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()){
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return el;
}
// Pinta la vista ignorando los undefined/false de los elementos condicionales (cond && h(...)).
function render(...nodes){
  app.replaceChildren(...nodes.flat().filter(n => n != null && n !== false));
}
function lsGet(key, fallback){
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function lsSet(key, val){
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){}
}
const getF = () => Object.assign({bloque:"todo", temas:[]}, lsGet("nuh_filtros", {}));
const setF = f => lsSet("nuh_filtros", f);
const getPlayed = () => lsGet("nuh_jugadas", []);
const setPlayed = a => lsSet("nuh_jugadas", a);

let SONGS = [];
function pool(f){
  return SONGS.filter(s =>
    (f.bloque === "todo" || s.bloque === f.bloque) &&
    (!f.temas.length || f.temas.includes(s.tema)));
}

/* ---------- Arranque ---------- */
// Dentro de la app Android, config.js trae la URL de tu web: se intenta bajar de allí la lista
// más reciente (4 s máximo) y, si no hay conexión, se usa la copia que lleva la app.
function cargarCanciones(){
  const local = () => fetch("canciones.json", {cache:"no-cache"}).then(r => { if (!r.ok) throw new Error("local"); return r.json(); });
  const url = window.NUH_CONFIG && window.NUH_CONFIG.jsonUrl;
  if (!url) return local();
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 4000);
  return fetch(url + "?t=" + Date.now(), {signal: ctrl.signal, cache:"no-cache"})
    .then(r => { if (!r.ok) throw new Error("remoto"); return r.json(); })
    .then(d => { if (!Array.isArray(d) || !d.length) throw new Error("vacío"); return d; })
    .catch(local)
    .finally(() => clearTimeout(t));
}
cargarCanciones()
  .then(data => { SONGS = data; route(); })
  .catch(() => { render(h("p", {class:"msg"}, "No se pudo cargar canciones.json")); });

function route(){
  const p = new URLSearchParams(location.search);
  if (p.has("admin")) return viewAdmin();
  if (p.has("scan")) return viewScan();
  if (p.has("id")){
    const s = SONGS.find(x => x.id === p.get("id"));
    return s ? viewSong(s) : viewHome("No existe la carta " + p.get("id"));
  }
  viewHome();
}

/* ---------- Vista: inicio ---------- */
function viewHome(error){
  stopPlayer();
  document.body.classList.remove("playing");
  const f = getF();
  const list = pool(f);
  const withYt = list.filter(s => s.yt).length;
  const played = getPlayed();

  const bloqueRow = h("div", {class:"row"}, Object.entries(BLOQUES).map(([k,label]) =>
    h("button", {class:"chip " + (k==="metal"?"metal":""), "aria-pressed": f.bloque===k,
      onclick: () => { f.bloque = k; f.temas = f.temas.filter(t => SONGS.some(s => s.tema===t && (k==="todo"||s.bloque===k))); setF(f); viewHome(); }}, label)));

  const visibles = [...new Set(SONGS.filter(s => f.bloque==="todo" || s.bloque===f.bloque).map(s => s.tema))];
  const temaRow = h("div", {class:"row"}, visibles.map(t =>
    h("button", {class:"chip", "aria-pressed": f.temas.includes(t),
      onclick: () => { f.temas = f.temas.includes(t) ? f.temas.filter(x => x!==t) : [...f.temas, t]; setF(f); viewHome(); }},
      TEMAS[t] || t)));

  render(
    h("h1", {}, "Nuhitster"),
    h("p", {class:"tag"}, "Ordena la música de más antigua a más nueva. Nu metal, metal moderno y lo más oscuro del gótico."),
    error && h("p", {class:"msg"}, error),
    h("section", {class:"panel"}, h("h2", {}, "Mazo"), bloqueRow),
    h("section", {class:"panel"}, h("h2", {}, "Temas (vacío = todos)"), temaRow),
    h("button", {class:"big", onclick: viewScan}, "Escanear carta"),
    h("button", {class:"big alt", disabled: !withYt, onclick: draw}, "Carta aleatoria (sin cartas)"),
    h("p", {class:"small"},
      withYt + " canciones con enlace de " + list.length + " en este mazo · " + played.length + " ya sacadas."),
    !withYt && h("p", {class:"small warn"}, "Aún no hay enlaces de YouTube en canciones.json. Mira el README (paso resolver_ids.py)."),
    h("div", {class:"row"},
      h("button", {class:"ghost", onclick: () => { setPlayed([]); viewHome(); }}, "Reiniciar mazo"),
      h("a", {class:"ghost", href:"?admin", style:"text-decoration:none"}, "Lista (spoilers)"))
  );
}

function draw(){
  const f = getF();
  const p = pool(f).filter(s => s.yt);
  if (!p.length) return viewHome("No hay canciones con enlace en este mazo.");
  let played = getPlayed();
  let rest = p.filter(s => !played.includes(s.id));
  if (!rest.length){ played = []; rest = p; }
  const s = rest[Math.floor(Math.random() * rest.length)];
  setPlayed([...played, s.id]);
  history.replaceState(null, "", "?id=" + s.id);
  viewSong(s);
}

/* ---------- Reproductor YouTube ---------- */
let ytPlayer = null, ytReady = null, currentSong = null;

function loadYT(){
  if (ytReady) return ytReady;
  ytReady = new Promise((resolve, reject) => {
    if (window.YT && window.YT.Player) return resolve();
    window.onYouTubeIframeAPIReady = resolve;
    const s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    s.onerror = () => { ytReady = null; s.remove(); reject(new Error("sin conexión con YouTube")); };
    document.head.appendChild(s);
  });
  return ytReady;
}
function pvars(start){
  const v = { playsinline:1, controls:0, rel:0, modestbranding:1, disablekb:1, fs:0, autoplay:1, start: start };
  if (/^https?:$/.test(location.protocol)){ v.origin = location.origin; v.widget_referrer = location.href; }
  return v;
}
function stopPlayer(){
  try { if (ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo(); } catch(e){}
}

async function viewSong(s){
  currentSong = s;
  document.body.classList.remove("playing");
  const cover = h("div", {class:"cover"}, h("div", {class:"eq"}, [1,2,3,4,5].map(() => h("i"))));
  const stage = h("div", {class:"stage"}, h("div", {id:"yt"}), cover);
  const msg = h("div", {class:"msg hide"});
  const playBtn = h("button", {class:"play", onclick: toggle}, "▶ Reproducir");
  const revealBox = h("section", {class:"panel reveal hide"},
    h("div", {class:"small"}, "Año"),
    h("div", {class:"yr"}, String(s.anio)),
    h("div", {class:"tt"}, s.titulo),
    h("div", {class:"ar"}, s.artista),
    h("span", {class:"badge " + s.bloque}, TEMAS[s.tema] || s.tema));
  const revealBtn = h("button", {class:"big", onclick: () => {
    revealBox.classList.remove("hide");
    cover.classList.add("off");
    revealBtn.classList.add("hide");
  }}, "Revelar");

  render(
    h("div", {class:"top"},
      h("a", {href:"./", onclick: e => { e.preventDefault(); history.replaceState(null, "", "./"); viewHome(); }}, "← Inicio"),
      h("span", {class:"small"}, "Carta " + s.id)),
    stage, msg,
    h("div", {class:"ctrl"},
      h("button", {onclick: () => seek(-10)}, "−10 s"),
      playBtn,
      h("button", {onclick: () => seek(10)}, "+10 s")),
    h("div", {class:"row", style:"margin-bottom:12px"},
      h("button", {class:"ghost", onclick: restart}, "↺ Desde el principio")),
    revealBtn, revealBox,
    h("div", {class:"row", style:"margin-top:16px"},
      h("button", {class:"ghost", style:"flex:1", onclick: viewScan}, "Escanear otra"),
      h("button", {class:"ghost", style:"flex:1", onclick: draw}, "Carta aleatoria"))
  );

  function showError(text){ msg.textContent = text; msg.classList.remove("hide"); }
  if (!s.yt){
    showError("Esta canción aún no tiene enlace de YouTube (campo yt en canciones.json).");
    return;
  }

  try { await loadYT(); }
  catch(e){ showError("No se pudo cargar YouTube. Comprueba la conexión a internet y vuelve a escanear la carta."); return; }
  if (currentSong !== s) return;   // el usuario ya cambió de carta mientras cargaba
  const start = s.inicio || 0;
  if (ytPlayer && ytPlayer.loadVideoById){
    // El contenedor se recrea en cada vista, así que se reconstruye el reproductor.
    try { ytPlayer.destroy(); } catch(e){}
    ytPlayer = null;
  }
  ytPlayer = new YT.Player("yt", {
    videoId: s.yt,
    playerVars: pvars(start),
    events: {
      onReady: e => { try { e.target.playVideo(); } catch(_){} },   // si el navegador lo bloquea, queda el botón ▶
      onStateChange: e => {
        const playing = e.data === YT.PlayerState.PLAYING;
        document.body.classList.toggle("playing", playing);
        playBtn.textContent = playing ? "⏸ Pausa" : "▶ Reproducir";
      },
      onError: () => showError("YouTube no permite reproducir este vídeo incrustado. Cambia el enlace (yt) de la carta " + s.id + " por otra versión.")
    }
  });

  function toggle(){
    if (!ytPlayer || !ytPlayer.getPlayerState) return;
    const st = ytPlayer.getPlayerState();
    if (st === YT.PlayerState.PLAYING) ytPlayer.pauseVideo(); else ytPlayer.playVideo();
  }
  function seek(d){
    if (!ytPlayer || !ytPlayer.getCurrentTime) return;
    ytPlayer.seekTo(Math.max(0, ytPlayer.getCurrentTime() + d), true);
  }
  function restart(){
    if (!ytPlayer || !ytPlayer.seekTo) return;
    ytPlayer.seekTo(start, true); ytPlayer.playVideo();
  }
}

/* ---------- Escáner de QR ---------- */
let scanStream = null, scanRaf = 0;

function stopScan(){
  cancelAnimationFrame(scanRaf); scanRaf = 0;
  if (scanStream){ scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
}
function loadScript(src){
  return new Promise((ok, ko) => {
    const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = () => ko(new Error("No se pudo cargar " + src));
    document.head.appendChild(s);
  });
}
// Acepta la URL completa del QR (…/?id=042), "id=042" o solo el número.
function idFromQR(text){
  text = String(text || "").trim();
  try { const id = new URL(text).searchParams.get("id"); if (id) return id.trim(); } catch(e){}
  const m = text.match(/(?:^|[?&])id=([^&#\s]+)/);
  if (m) return decodeURIComponent(m[1]);
  return /^\d{1,4}$/.test(text) ? text.padStart(3, "0") : null;
}

async function viewScan(){
  stopPlayer(); stopScan();
  document.body.classList.remove("playing");
  history.replaceState(null, "", "./");

  const video = h("video", {playsinline:true, autoplay:true});
  video.muted = true;
  const msg = h("div", {class:"msg hide"});
  const input = h("input", {class:"id", inputmode:"numeric", placeholder:"Nº de carta, p. ej. 042", maxlength:"4"});
  let done = false;

  function showErr(t){ msg.textContent = t; msg.classList.remove("hide"); }
  function abrir(id){
    const s = SONGS.find(x => x.id === id);
    if (!s){ showErr(id ? "La carta " + id + " no está en este mazo." : "Ese QR no es de una carta de Nuhitster."); return false; }
    done = true; stopScan();
    if (navigator.vibrate) navigator.vibrate(60);
    history.replaceState(null, "", "?id=" + s.id);
    viewSong(s);
    return true;
  }
  function manual(){ const v = input.value.trim(); abrir(/^\d{1,4}$/.test(v) ? v.padStart(3, "0") : null); }
  input.addEventListener("keydown", e => { if (e.key === "Enter") manual(); });

  render(
    h("div", {class:"top"},
      h("a", {href:"./", onclick: e => { e.preventDefault(); done = true; stopScan(); viewHome(); }}, "← Inicio"),
      h("span", {class:"small"}, "Escanear carta")),
    h("div", {class:"scan"}, video, h("div", {class:"frame"})),
    h("p", {class:"small"}, "Apunta al QR de la carta. La canción empieza al instante."),
    msg,
    h("section", {class:"panel"},
      h("h2", {}, "¿Sin cámara? Escribe el número"),
      h("div", {class:"row", style:"flex-wrap:nowrap"}, input, h("button", {class:"ghost", onclick: manual}, "Abrir")))
  );

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    showErr("Este navegador no permite usar la cámara (hace falta una página https). Escribe el número de la carta.");
    return;
  }
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
  } catch(e){
    showErr(e && e.name === "NotAllowedError"
      ? "Permiso de cámara denegado. Actívalo en los ajustes o escribe el número de la carta."
      : "No se pudo abrir la cámara: " + (e && e.message ? e.message : e));
    return;
  }
  if (done){ stopScan(); return; }   // el usuario salió mientras se pedía el permiso
  video.srcObject = scanStream;
  try { await video.play(); } catch(e){}

  let detector = null;
  if ("BarcodeDetector" in window){ try { detector = new BarcodeDetector({formats:["qr_code"]}); } catch(e){} }
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d", {willReadFrequently:true});

  async function decode(){
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw) return null;
    if (detector){
      try { const r = await detector.detect(video); return r.length ? r[0].rawValue : null; }
      catch(e){ detector = null; }   // no soportado de verdad: pasa a jsQR
    }
    if (!window.jsQR) await loadScript("vendor/jsQR.js");
    const k = Math.min(1, 640 / Math.max(vw, vh));
    canvas.width = Math.round(vw * k); canvas.height = Math.round(vh * k);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const r = window.jsQR(img.data, img.width, img.height, {inversionAttempts:"dontInvert"});
    return r ? r.data : null;
  }

  let busy = false, last = 0;
  const tick = async t => {
    if (done || !scanStream) return;
    scanRaf = requestAnimationFrame(tick);
    if (busy || t - last < 120) return;
    busy = true; last = t;
    try {
      const txt = await decode();
      if (txt && !done) abrir(idFromQR(txt));
    } catch(e){
      showErr("Error al leer la cámara: " + (e && e.message ? e.message : e));
    } finally { busy = false; }
  };
  scanRaf = requestAnimationFrame(tick);
}

/* ---------- Vista: lista (spoilers) ---------- */
function viewAdmin(){
  const sin = SONGS.filter(s => !s.yt).length;
  const rev = SONGS.filter(s => s.revisar).length;
  render(
    h("div", {class:"top"}, h("a", {href:"./"}, "← Inicio"), h("span", {class:"small"}, "Lista")),
    h("p", {class:"small"}, SONGS.length + " canciones · " + sin + " sin enlace · " + rev + " con año por revisar"),
    h("table", {},
      h("thead", {}, h("tr", {}, ["ID","Año","Artista – Título","Tema","YT"].map(t => h("th", {}, t)))),
      h("tbody", {}, SONGS.map(s => h("tr", {},
        h("td", {}, s.id),
        h("td", {class: s.revisar ? "no" : ""}, String(s.anio) + (s.revisar ? " ?" : "")),
        h("td", {}, s.artista + " – " + s.titulo),
        h("td", {}, TEMAS[s.tema] || s.tema),
        h("td", {class: s.yt ? "ok" : "no"}, s.yt ? "✓" : "✗")))))
  );
}
/* ---------- Modo app: guardar la carcasa para abrir rápido ---------- */
// Dentro del APK (Capacitor) los archivos ya van incluidos, así que no hace falta.
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !window.Capacitor){
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
</body>
