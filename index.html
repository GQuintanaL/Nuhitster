<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a0f">
<title>Nuhitster</title>
<style>
  :root{
    --bg:#0b0a0f; --panel:#15131c; --panel2:#1d1a27; --line:#2b2738;
    --txt:#ece8f4; --mute:#8d86a0; --metal:#ff3b30; --goth:#a66bff; --ok:#3ddc97;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{min-height:100vh;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}
  main{max-width:520px;margin:0 auto;padding-top:20px}
  a{color:var(--mute)}
  h1{margin:0;font-size:2.1rem;letter-spacing:.18em;font-weight:900;text-transform:uppercase;
     background:linear-gradient(90deg,var(--metal),var(--goth));-webkit-background-clip:text;background-clip:text;color:transparent}
  .tag{color:var(--mute);margin:4px 0 22px;font-size:.95rem}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
  .panel h2{margin:0 0 10px;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700}
  .row{display:flex;flex-wrap:wrap;gap:8px}
  button{font:inherit;color:inherit;cursor:pointer}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:.92rem}
  .chip[aria-pressed="true"]{border-color:var(--goth);background:#2a2142}
  .chip.metal[aria-pressed="true"]{border-color:var(--metal);background:#3a1714}
  .big{width:100%;border:0;border-radius:16px;padding:18px;font-size:1.15rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
       background:linear-gradient(90deg,var(--metal),var(--goth));color:#fff}
  .big:disabled{opacity:.4}
  .ghost{background:transparent;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .small{font-size:.85rem;color:var(--mute)}
  .warn{color:#ffb74d}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .stage{position:relative;aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
  .stage #yt{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .stage iframe{width:100%;height:100%;border:0}
  .cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#2a2142,#0b0a0f 70%)}
  .cover.off{display:none}
  .eq{display:flex;gap:6px;align-items:flex-end;height:46px}
  .eq i{width:8px;height:12px;background:linear-gradient(var(--goth),var(--metal));border-radius:3px}
  .playing .eq i{animation:eq .9s ease-in-out infinite}
  .playing .eq i:nth-child(2){animation-delay:.15s}.playing .eq i:nth-child(3){animation-delay:.3s}
  .playing .eq i:nth-child(4){animation-delay:.45s}.playing .eq i:nth-child(5){animation-delay:.6s}
  @keyframes eq{0%,100%{height:10px}50%{height:46px}}
  .ctrl{display:grid;grid-template-columns:1fr 2fr 1fr;gap:8px;margin:12px 0}
  .ctrl button{padding:14px 0;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-size:1.05rem}
  .ctrl .play{background:linear-gradient(90deg,var(--metal),var(--goth));border:0;font-weight:800}
  .reveal{text-align:center}
  .reveal .yr{font-size:4.2rem;font-weight:900;line-height:1;margin:6px 0}
  .reveal .tt{font-size:1.25rem;font-weight:700}
  .reveal .ar{color:var(--mute);margin-top:2px}
  .badge{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:999px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line)}
  .badge.metal{color:var(--metal);border-color:var(--metal)} .badge.gotico{color:var(--goth);border-color:var(--goth)}
  .msg{padding:12px;border-radius:12px;background:#2a1a1a;border:1px solid #5a2a2a;margin:12px 0;font-size:.92rem}
  table{width:100%;border-collapse:collapse;font-size:.85rem}
  th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--mute);font-weight:600}
  td.no{color:#ff7a70} td.ok{color:var(--ok)}
  .hide{display:none}
</style>
</head>
<body>
<main id="app"></main>

<script>
"use strict";

/* ---------- Configuración ---------- */
const BLOQUES = {
  todo:   "Todo mezclado",
  metal:  "Nu metal y metal moderno",
  gotico: "Gótico, post-punk y synthpop"
};
const TEMAS = {
  "nu-metal":"Nu metal", "alt-metal":"Alt metal", "metalcore":"Metalcore",
  "metal-moderno":"Metal moderno", "industrial":"Industrial",
  "gothic-rock":"Gothic rock", "post-punk":"Post-punk", "darkwave":"Darkwave",
  "synthpop":"Synthpop", "gothic-metal":"Gothic metal"
};

/* ---------- Utilidades ---------- */
const app = document.getElementById("app");
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs || {})){
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()){
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return el;
}
function lsGet(key, fallback){
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function lsSet(key, val){
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){}
}
const getF = () => Object.assign({bloque:"todo", temas:[]}, lsGet("nuh_filtros", {}));
const setF = f => lsSet("nuh_filtros", f);
const getPlayed = () => lsGet("nuh_jugadas", []);
const setPlayed = a => lsSet("nuh_jugadas", a);

let SONGS = [];
function pool(f){
  return SONGS.filter(s =>
    (f.bloque === "todo" || s.bloque === f.bloque) &&
    (!f.temas.length || f.temas.includes(s.tema)));
}

/* ---------- Arranque ---------- */
fetch("canciones.json", {cache:"no-cache"})
  .then(r => r.json())
  .then(data => { SONGS = data; route(); })
  .catch(() => { app.replaceChildren(h("p", {class:"msg"}, "No se pudo cargar canciones.json")); });

function route(){
  const p = new URLSearchParams(location.search);
  if (p.has("admin")) return viewAdmin();
  if (p.has("id")){
    const s = SONGS.find(x => x.id === p.get("id"));
    return s ? viewSong(s) : viewHome("No existe la carta " + p.get("id"));
  }
  viewHome();
}

/* ---------- Vista: inicio ---------- */
function viewHome(error){
  stopPlayer();
  document.body.classList.remove("playing");
  const f = getF();
  const list = pool(f);
  const withYt = list.filter(s => s.yt).length;
  const played = getPlayed();

  const bloqueRow = h("div", {class:"row"}, Object.entries(BLOQUES).map(([k,label]) =>
    h("button", {class:"chip " + (k==="metal"?"metal":""), "aria-pressed": f.bloque===k,
      onclick: () => { f.bloque = k; f.temas = f.temas.filter(t => SONGS.some(s => s.tema===t && (k==="todo"||s.bloque===k))); setF(f); viewHome(); }}, label)));

  const visibles = [...new Set(SONGS.filter(s => f.bloque==="todo" || s.bloque===f.bloque).map(s => s.tema))];
  const temaRow = h("div", {class:"row"}, visibles.map(t =>
    h("button", {class:"chip", "aria-pressed": f.temas.includes(t),
      onclick: () => { f.temas = f.temas.includes(t) ? f.temas.filter(x => x!==t) : [...f.temas, t]; setF(f); viewHome(); }},
      TEMAS[t] || t)));

  app.replaceChildren(
    h("h1", {}, "Nuhitster"),
    h("p", {class:"tag"}, "Ordena la música de más antigua a más nueva. Nu metal, metal moderno y lo más oscuro del gótico."),
    error && h("p", {class:"msg"}, error),
    h("section", {class:"panel"}, h("h2", {}, "Mazo"), bloqueRow),
    h("section", {class:"panel"}, h("h2", {}, "Temas (vacío = todos)"), temaRow),
    h("button", {class:"big", disabled: !withYt, onclick: draw}, "Sacar carta"),
    h("p", {class:"small"},
      withYt + " canciones con enlace de " + list.length + " en este mazo · " + played.length + " ya sacadas."),
    !withYt && h("p", {class:"small warn"}, "Aún no hay enlaces de YouTube en canciones.json. Mira el README (paso resolver_ids.py)."),
    h("div", {class:"row"},
      h("button", {class:"ghost", onclick: () => { setPlayed([]); viewHome(); }}, "Reiniciar mazo"),
      h("a", {class:"ghost", href:"?admin", style:"text-decoration:none"}, "Lista (spoilers)"))
  );
}

function draw(){
  const f = getF();
  const p = pool(f).filter(s => s.yt);
  if (!p.length) return viewHome("No hay canciones con enlace en este mazo.");
  let played = getPlayed();
  let rest = p.filter(s => !played.includes(s.id));
  if (!rest.length){ played = []; rest = p; }
  const s = rest[Math.floor(Math.random() * rest.length)];
  setPlayed([...played, s.id]);
  history.replaceState(null, "", "?id=" + s.id);
  viewSong(s);
}

/* ---------- Reproductor YouTube ---------- */
let ytPlayer = null, ytReady = null, currentSong = null;

function loadYT(){
  if (ytReady) return ytReady;
  ytReady = new Promise(resolve => {
    if (window.YT && window.YT.Player) return resolve();
    window.onYouTubeIframeAPIReady = resolve;
    const s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(s);
  });
  return ytReady;
}
function stopPlayer(){
  try { if (ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo(); } catch(e){}
}

async function viewSong(s){
  currentSong = s;
  document.body.classList.remove("playing");
  const cover = h("div", {class:"cover"}, h("div", {class:"eq"}, [1,2,3,4,5].map(() => h("i"))));
  const stage = h("div", {class:"stage"}, h("div", {id:"yt"}), cover);
  const msg = h("div", {class:"msg hide"});
  const playBtn = h("button", {class:"play", onclick: toggle}, "▶ Reproducir");
  const revealBox = h("section", {class:"panel reveal hide"},
    h("div", {class:"small"}, "Año"),
    h("div", {class:"yr"}, String(s.anio)),
    h("div", {class:"tt"}, s.titulo),
    h("div", {class:"ar"}, s.artista),
    h("span", {class:"badge " + s.bloque}, TEMAS[s.tema] || s.tema));
  const revealBtn = h("button", {class:"big", onclick: () => {
    revealBox.classList.remove("hide");
    cover.classList.add("off");
    revealBtn.classList.add("hide");
  }}, "Revelar");

  app.replaceChildren(
    h("div", {class:"top"},
      h("a", {href:"./", onclick: e => { e.preventDefault(); history.replaceState(null, "", "./"); viewHome(); }}, "← Inicio"),
      h("span", {class:"small"}, "Carta " + s.id)),
    stage, msg,
    h("div", {class:"ctrl"},
      h("button", {onclick: () => seek(-10)}, "−10 s"),
      playBtn,
      h("button", {onclick: () => seek(10)}, "+10 s")),
    h("div", {class:"row", style:"margin-bottom:12px"},
      h("button", {class:"ghost", onclick: restart}, "↺ Desde el principio")),
    revealBtn, revealBox,
    h("div", {style:"margin-top:16px"}, h("button", {class:"ghost", style:"width:100%", onclick: draw}, "Siguiente carta aleatoria"))
  );

  function showError(text){ msg.textContent = text; msg.classList.remove("hide"); }
  if (!s.yt){
    showError("Esta canción aún no tiene enlace de YouTube (campo yt en canciones.json).");
    return;
  }

  await loadYT();
  const start = s.inicio || 0;
  if (ytPlayer && ytPlayer.loadVideoById){
    // El contenedor se recrea en cada vista, así que se reconstruye el reproductor.
    try { ytPlayer.destroy(); } catch(e){}
    ytPlayer = null;
  }
  ytPlayer = new YT.Player("yt", {
    videoId: s.yt,
    playerVars: { playsinline:1, controls:0, rel:0, modestbranding:1, disablekb:1, fs:0, start: start },
    events: {
      onStateChange: e => {
        const playing = e.data === YT.PlayerState.PLAYING;
        document.body.classList.toggle("playing", playing);
        playBtn.textContent = playing ? "⏸ Pausa" : "▶ Reproducir";
      },
      onError: () => showError("YouTube no permite reproducir este vídeo incrustado. Cambia el enlace (yt) de la carta " + s.id + " por otra versión.")
    }
  });

  function toggle(){
    if (!ytPlayer || !ytPlayer.getPlayerState) return;
    const st = ytPlayer.getPlayerState();
    if (st === YT.PlayerState.PLAYING) ytPlayer.pauseVideo(); else ytPlayer.playVideo();
  }
  function seek(d){
    if (!ytPlayer || !ytPlayer.getCurrentTime) return;
    ytPlayer.seekTo(Math.max(0, ytPlayer.getCurrentTime() + d), true);
  }
  function restart(){
    if (!ytPlayer || !ytPlayer.seekTo) return;
    ytPlayer.seekTo(start, true); ytPlayer.playVideo();
  }
}

/* ---------- Vista: lista (spoilers) ---------- */
function viewAdmin(){
  const sin = SONGS.filter(s => !s.yt).length;
  const rev = SONGS.filter(s => s.revisar).length;
  app.replaceChildren(
    h("div", {class:"top"}, h("a", {href:"./"}, "← Inicio"), h("span", {class:"small"}, "Lista")),
    h("p", {class:"small"}, SONGS.length + " canciones · " + sin + " sin enlace · " + rev + " con año por revisar"),
    h("table", {},
      h("thead", {}, h("tr", {}, ["ID","Año","Artista – Título","Tema","YT"].map(t => h("th", {}, t)))),
      h("tbody", {}, SONGS.map(s => h("tr", {},
        h("td", {}, s.id),
        h("td", {class: s.revisar ? "no" : ""}, String(s.anio) + (s.revisar ? " ?" : "")),
        h("td", {}, s.artista + " – " + s.titulo),
        h("td", {}, TEMAS[s.tema] || s.tema),
        h("td", {class: s.yt ? "ok" : "no"}, s.yt ? "✓" : "✗")))))
  );
}
</script>
</body>
</html>
